<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tecnoplafon - Accesso</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{margin:0;background:#eef4ff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}
    .tp-full-login-card{width:min(460px,100%);background:#fff;border:1px solid #dbeafe;border-radius:28px;box-shadow:0 28px 75px rgba(15,23,42,.16);padding:28px;box-sizing:border-box}
    .tp-full-login-logo{display:flex;justify-content:center;margin-bottom:18px}.tp-full-login-logo img{width:min(330px,86vw);max-height:105px;object-fit:contain}
    h1{margin:0;text-align:center;color:#0f172a;font-size:26px}p{text-align:center;color:#64748b;margin:10px 0 20px}label{display:block;margin:12px 0 7px;font-size:12px;font-weight:950;color:#64748b;text-transform:uppercase}
    input{width:100%;min-height:56px;border:1px solid #cbd5e1;border-radius:16px;padding:14px 15px;font-size:17px;box-sizing:border-box}
    #loginError{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-weight:800;line-height:1.35}
    button{margin-top:16px;width:100%;min-height:58px;border:0;border-radius:18px;background:linear-gradient(135deg,#1e40af,#2563eb);color:white;font-weight:950;font-size:16px;cursor:pointer}small{display:block;margin-top:16px;color:#64748b;text-align:center;line-height:1.4}
  </style>
</head>
<body>
  <div class="tp-full-login-card">
    <div class="tp-full-login-logo"><img src="https://tecnoplafon.ch/wp-content/uploads/2019/08/TECNOPLAFON-logo_v01.png" alt="Tecnoplafon"></div>
    <h1>Gestione Ore</h1>
    <p>Accedi con email/nome e password. L'app apre una pagina separata in base al ruolo.</p>
    <label>Email o nome</label>
    <input id="loginEmail" type="text" value="info@tecnoplafon.ch" autocomplete="username">
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){login()}" autofocus>
    <div id="loginError"></div>
    <button id="loginBtn" onclick="login()">Entra</button>
    <small>Operaio apre solo il portale collaboratore. Admin/caposquadra apre la gestione completa.</small>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://sgdmrramdemwxqdmjgna.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TRDxM5otfvd2GxMTOFpc6g_Ogybejd5";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    function showErr(msg){ const e=document.getElementById('loginError'); e.textContent=msg; e.style.display='block'; }
    function hideErr(){ const e=document.getElementById('loginError'); e.textContent=''; e.style.display='none'; }
    function cleanUser(v){ return String(v||'').trim(); }
    function normRole(r){ return String(r||'').trim().toLowerCase(); }
    function isAdminRole(r){ r=normRole(r); return r==='admin' || r==='amministratore' || r==='caposquadra' || r.indexOf('capo')>=0; }
    async function login(){
      const user = cleanUser(document.getElementById('loginEmail').value);
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      if(!user || !pass){ showErr('Inserisci email/nome e password.'); return; }
      btn.disabled=true; showErr('Accesso in corso...');
      try{
        await sb.auth.signOut();
        let profile = null;
        // Sicurezza: nessuna password admin salvata nel file HTML.
        // Gli admin devono entrare con Supabase Auth e ruolo admin/caposquadra in tabella profili.
        if(user.includes('@')){
          const res = await sb.auth.signInWithPassword({email:user,password:pass});
          if(!res.error && res.data && res.data.user){
            const pr = await sb.from('profili').select('id,nome,email,ruolo,stato').eq('id',res.data.user.id).maybeSingle();
            if(pr.error) throw pr.error;
            if(pr.data) profile = {...pr.data, sorgente:'profili'};
          }
        }
        if(!profile){
          const cols = 'id,nome,email,ruolo,stato,max_ore_giorno';
          const safeUser = user.replace(/[%_]/g,'');
          let q = null;
          if(user.includes('@')){
            q = await sb.from('collaboratori').select(cols).ilike('email', user).eq('password_app', pass).maybeSingle();
          }
          if(!q || !q.data){
            q = await sb.from('collaboratori').select(cols).ilike('nome', user).eq('password_app', pass).maybeSingle();
          }
          if(!q || !q.data){
            const list = await sb.from('collaboratori').select(cols).or(`nome.ilike.%${safeUser}%,email.ilike.%${safeUser}%`).eq('password_app', pass).limit(2);
            if(list.error) throw list.error;
            if(list.data && list.data.length === 1) q = {data:list.data[0]};
            else if(list.data && list.data.length > 1) throw new Error('Ho trovato piu collaboratori con questo nome. Inserisci email completa o nome completo.');
          }
          if(q && q.error && q.error.code !== 'PGRST116') throw q.error;
          if(!q || !q.data) throw new Error('Utente non trovato o password collaboratore non corretta. Controlla Admin > Collaboratori.');
          profile = {...q.data, sorgente:'collaboratori'};
        }
        if(String(profile.stato||'Attivo').toLowerCase() !== 'attivo') throw new Error('Accesso bloccato: utente non attivo.');
        sessionStorage.setItem('tp_current_user_v66', JSON.stringify(profile));
        localStorage.setItem('tp_current_user_v66', JSON.stringify(profile));
        if(isAdminRole(profile.ruolo)) {
          sessionStorage.setItem('tecnoplafonAdminUnlocked','1');
          window.location.href = 'admin.html';
        } else {
          sessionStorage.removeItem('tecnoplafonAdminUnlocked');
          window.location.href = 'operaio.html';
        }
      }catch(e){ showErr('Login fallito: ' + (e.message || e)); btn.disabled=false; }
    }
  </script>
<!-- fix v68: nomi file canonici, login collaboratore piu robusto, routing admin/operaio corretto -->
</body>
</html>
